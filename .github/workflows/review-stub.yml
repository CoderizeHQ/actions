name: review-stub

# Posts the `review` check on every open CoderizeHQ PR, as the coderizehq-reviewer App, until the review service is
# live (Phase 5). Its key lives only in the `review` environment, which accepts only main. GitHub runs schedules late
# when it's busy, so a result can take 5 to 15 minutes. Logs show counts only: this repo is public.
on:
  schedule:
    # Off the top of the hour, when GitHub drops the most scheduled runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: review-stub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    environment: review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: CoderizeHQ

      - name: Post review checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/reviewStub.mjs
