name: deploy-preview

# Each site's deploy.yml calls this on every push to main (no path filters):
#   uses: CoderizeHQ/actions/.github/workflows/deploy-preview.yml@v1
#   with: { site: sbmcdn-com }
# A site built from one package of an app repo (platform README "Sites in an app repo") also passes its package:
#   with: { site: admin-example-com, package: ./apps/admin }
# It builds the commit once, stores that build write-once under _builds/<site>/<commit>/ with its manifest (the build
# release later publishes to live), and publishes it to https://<site>.preview.coderize.dev.
#
# Two jobs, so the site's own code never runs where AWS credentials exist: `build` runs pnpm install and build with
# no role, and `deploy` only uploads what it built. The deploy role, coderizehq-preview-deploy-<site>, trusts only this
# file at v1 or v1.*, from the site's repo on main; its ARN comes from `site`, never from an input.
#
# A content rebuild (platform's `rebuild` record field; scripts/lib/rebuild.mjs): the site's platform-written rebuild
# workflow, run by the repository_dispatch content-rebuild on main, calls this with `rebuild-commit`, the commit live
# runs now as rebuild-target.yml found it. Then `build` builds that commit instead of the run's, and `deploy` stores it
# write-once under _builds/<site>/<commit>/rebuilds/<run id>/ for the same run's release job, and leaves the preview
# alone (it shows main's head). Its deploy queue is its own, so a rebuild never replaces a push's waiting deploy.
on:
  workflow_call:
    inputs:
      site:
        description: The site's name (its domain with dots as hyphens, as in platform/sites/<site>.json)
        type: string
        required: true
      build-dir:
        description: Where the build writes the site (inside the package, when there is one)
        type: string
        default: dist
      package:
        description: The site's pnpm package as a path (./apps/web), for a site in an app repo; empty for the repo root
        type: string
        default: ''
      max-delete-share:
        description: Refuse a publish that deletes more than this share of the preview's files (0 to 1)
        type: string
        default: '0.25'
      rebuild-commit:
        description: A content rebuild's commit (rebuild-target.yml's output), from the site's rebuild workflow only; empty for every other run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    outputs:
      lockfile-sha256: ${{ steps.lockfile.outputs.sha256 }}
    steps:
      # The name goes into role ARNs and S3 paths; coderizehq-preview-deploy-<site> must fit IAM's 64-character limit.
      - name: Check the site name
        env:
          SITE: ${{ inputs.site }}
        run: |
          [[ "$SITE" =~ ^[a-z0-9-]{1,38}$ ]] || { echo "::error::site must be 1 to 38 of a-z, 0-9 and -"; exit 1; }

      # Only the content-rebuild dispatch may build anything but the run's own commit.
      - name: Check the content rebuild
        if: inputs.rebuild-commit != ''
        env:
          COMMIT: ${{ inputs.rebuild-commit }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.action }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::rebuild-commit must be a 40-character commit SHA"; exit 1; }
          [ "$EVENT" = repository_dispatch ] && [ "$DISPATCH" = content-rebuild ] && [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "::error::rebuild-commit is only for the repository_dispatch content-rebuild on main (got $EVENT $DISPATCH on $GITHUB_REF)"; exit 1;
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.rebuild-commit || github.sha }}
          persist-credentials: false

      # Before anything from the site runs, so the manifest's lockfile hash is the committed file's.
      - name: Hash the lockfile
        id: lockfile
        run: |
          [ -f pnpm-lock.yaml ] || { echo "::error::pnpm-lock.yaml is missing"; exit 1; }
          echo "sha256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        env:
          PACKAGE: ${{ inputs.package }}
          BUILD_DIR: ${{ inputs.build-dir }}
        run: |
          # No package: the repo root builds the site (a site repo). A package (a site in an app repo, platform README
          # "Sites in an app repo"): a path to exactly one pnpm package, built alone, as build-app-image builds an app;
          # build-dir is then inside it.
          if [ -z "$PACKAGE" ]; then
            pnpm run build
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PACKAGE" =~ ^\./[A-Za-z0-9_-][A-Za-z0-9_./-]*$ && "$PACKAGE" != *..* && "$PACKAGE" != */ ]] || { echo "::error::package is a path to one pnpm package in the repo (./apps/web)"; exit 1; }
          matches=$(pnpm --filter "$PACKAGE" list --depth -1 --json | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(JSON.parse(s).length))')
          [ "$matches" = 1 ] || { echo "::error::package $PACKAGE matches $matches packages, not one"; exit 1; }
          pnpm --filter "$PACKAGE" run build
          echo "dir=${PACKAGE#./}/$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: ${{ steps.build.outputs.dir }}
          # .well-known/ and other dot-files are part of the site.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    # One queue per site: a running deploy is never cancelled, and of the waiting ones the newest wins. Content rebuilds
    # queue apart: they write only their own rebuild folder, and must never replace a push's waiting deploy.
    concurrency:
      group: deploy-preview-${{ inputs.site }}${{ inputs.rebuild-commit != '' && '-rebuild' || '' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts from that same commit. deployPreview.mjs checks it against the OIDC token's job_workflow_sha.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/deploy-preview.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of deploy-preview.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - run: pnpm install --frozen-lockfile
        working-directory: actions

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}/site-build

      # A slower run of an older commit stores its build (release may want it) but leaves the preview to the newer one.
      - name: Is this commit still main's head?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "publish=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::798070830797:role/coderizehq-preview-deploy-${{ inputs.site }}
          aws-region: us-east-1

      - name: Store the build and publish the preview
        env:
          SITE: ${{ inputs.site }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.rebuild-commit || github.sha }}
          RUN_SHA: ${{ github.sha }}
          REBUILD_RUN: ${{ inputs.rebuild-commit != '' && github.run_id || '' }}
          CONTENT_SHA256: ${{ inputs.rebuild-commit != '' && github.event.client_payload.content_sha256 || '' }}
          BUILD_DIR: ${{ runner.temp }}/site-build
          LOCKFILE_SHA256: ${{ needs.build.outputs.lockfile-sha256 }}
          WORKFLOW_SHA: ${{ steps.self.outputs.sha }}
          PUBLISH: ${{ steps.head.outputs.publish }}
          MAX_DELETE_SHARE: ${{ inputs.max-delete-share }}
        run: node actions/scripts/deployPreview.mjs

  # Emails ops@coderize.dev when the build or the deploy fails (email only, C955 a; a passing preview sends nothing).
  # It runs as coderizehq-notify-send in the live account, which may only send from notify@notify.coderize.dev to ops@
  # with the coderizehq-notify configuration set, and trusts only this file and release.yml at v1 or v1.*, from a site
  # repo's main or a version tag. Its ARN is fixed here, never an input, so a site's workflow stays one `uses:` line.
  notify:
    needs: [build, deploy]
    if: always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/deploy-preview.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of deploy-preview.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - run: pnpm install --frozen-lockfile
        working-directory: actions

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-notify-send
          aws-region: us-east-1

      - name: Email ops@
        env:
          WORKFLOW: deploy-preview
          SITE: ${{ inputs.site }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ inputs.rebuild-commit || github.sha }}
          RESULTS: build=${{ needs.build.result }},deploy=${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node actions/scripts/notify.mjs
