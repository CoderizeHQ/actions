name: platform-checks

# The checks the `platform` ruleset makes every platform PR run (plan, Phase 3 "Shared workflows"): platform's
# tofu/rulesets.tf names this file, at refs/tags/v1, in the ruleset's "Require workflows to pass". GitHub runs it from
# here in platform's context, whatever the PR does to platform's own workflow files, and no PR merges until it passes.
#
# ci-tofu is called at v1 by its full name, so its jobs' OIDC tokens carry
# job_workflow_ref CoderizeHQ/actions/.github/workflows/ci-tofu.yml@refs/tags/v1: the only workflow
# coderizehq-infra-plan trusts. The two read-only credentials are platform's own repository secrets (a ruleset
# workflow reads the target repo's secrets, never this repo's), passed by name rather than `secrets: inherit`, so the
# PR's code never sees platform's other secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # GitHub also runs a ruleset workflow's pull_request trigger in the repo that holds it; the `if` keeps this off
  # actions' own PRs. It's never false in platform.
  ci:
    if: github.repository != 'CoderizeHQ/actions'
    uses: CoderizeHQ/actions/.github/workflows/ci-tofu.yml@v1
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
    secrets:
      CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      PLATFORM_READ_APP_KEY: ${{ secrets.PLATFORM_READ_APP_KEY }}
