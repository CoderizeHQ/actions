name: ci-tofu

# The checks on every platform PR (plan, Phase 3 "Shared workflows", ci-tofu). platform-checks.yml runs it through
# the `platform` ruleset's "Require workflows to pass", so a PR can't change or skip it by editing platform's own
# workflow files.
#
# `check` runs the PR-title check, tofu fmt and validate on every root, platform's unit tests (the trust-policy tests
# among them) and gitleaks over the full history. `trust` runs the live negative trust tests: the job's own OIDC token
# must be refused by every site role and by coderizehq-infra-deploy (scripts/trustProbe.mjs says which refusal each
# attempt proves). `plan` makes a read-only plan of each root as coderizehq-infra-plan, which trusts only this file
# at v1 or v1.*, from platform's pull requests; it can read the state but never write or lock it, so plans run with
# -lock=false. `comment` posts every plan on the PR in one comment, updated on each push.
#
# A plan runs the PR's code with the plan role's read access, so that role holds nothing that can change anything,
# and the two credentials it gets are read-only: a Cloudflare token and the coderizehq-platform-read App.
on:
  workflow_call:
    inputs:
      # aws/live's plan refreshes about 1,540 resources and is mostly waiting on reads, so it runs 30 at a time, as its
      # plan in platform's apply.yml does (platform #375). A plan only reads: S3 and IAM don't throttle at 30, and the
      # provider's retries absorb CloudFront's and CloudWatch's bursts. Every other root keeps OpenTofu's default of 10.
      roots:
        description: JSON list of the OpenTofu roots, each with the account its resources live in, "offline":true for a root planned against its last applied state with no provider credentials, and optionally "parallelism":N for how many resources its plan refreshes at once (default 10, OpenTofu's)
        type: string
        default: '[{"root":"tofu","account":"243891826043"},{"root":"aws/live","account":"243891826043","parallelism":30},{"root":"aws/preview","account":"798070830797"},{"root":"cloudflare/ai","account":"243891826043","offline":true}]'
    # Named like the caller's repository secrets, so a caller can pass them one by one or with `secrets: inherit`.
    # The read App's client id is the caller's PLATFORM_READ_APP_CLIENT_ID variable.
    secrets:
      CLOUDFLARE_READ_TOKEN:
        description: A read-only Cloudflare token (Zone Read, DNS Read) for roots with the cloudflare provider; without it their plans are skipped
        required: false
      PLATFORM_READ_APP_KEY:
        description: The coderizehq-platform-read App's private key, for the root with the github provider; without it that plan is skipped
        required: false

permissions:
  contents: read

env:
  # Same version and checksum as platform's tofu-root action (from tofu_1.13.9_SHA256SUMS).
  TOFU_VERSION: 1.13.9
  TOFU_SHA256: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
  # From gitleaks_8.30.1_checksums.txt on the gitleaks release page. The binary, not gitleaks-action, which needs a
  # paid licence for organizations.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install OpenTofu and gitleaks (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  tofu.zip" | sha256sum -c -
          unzip -q -o tofu.zip tofu -d "$RUNNER_TEMP/bin"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          failed=0
          for root in $(jq -r '.[].root' <<<"$ROOTS"); do
            echo "::group::$root"
            (cd "$root" && tofu init -backend=false -input=false -no-color >/dev/null && tofu validate -no-color) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Setup Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          # platform has no package.json to read a pnpm version from.
          version: 12.22.0
          runtime: node@26
          install: false

      # Every *.test.mjs in platform: the trust-policy tests, the routers, the not-found function, the site records.
      # Before the scripts are checked out below, so their tests aren't picked up here.
      - name: Unit tests
        run: node --test

      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts and the gitleaks rules from that same commit.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-tofu.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-tofu.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: .ci-tofu-actions
          persist-credentials: false

      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .ci-tofu-actions/scripts/prTitle.mjs

      # Scans platform's history only: the scripts' checkout is a separate repository inside the workspace.
      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner --exit-code 1 --config .ci-tofu-actions/config/gitleaks.toml .

  # The live negative trust tests (plan, Phase 2 "Who can change what"): this job's OIDC token, a platform PR running
  # ci-tofu.yml, must be refused by every role it must never reach, each refusal an AccessDenied from STS for a role
  # that exists (a site role the next apply will make only warns). platform's trust.test.mjs proves each condition
  # alone against the templates; this proves the deployed policies. The control: the same token must assume
  # coderizehq-infra-plan in each account. Any role assumed fails the job, and its credentials are never read.
  trust:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # platform's site records at the PR's base: every site's roles are tried. A record the PR adds has no roles
      # until its apply, so its refusals would prove nothing; it's tested on the PRs after that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: sites

      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts and the gitleaks rules from that same commit.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-tofu.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-tofu.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: .ci-tofu-actions
          persist-credentials: false

      # The plan role in each account, as AWS CLI profiles: the script checks with iam:GetRole that each refused role
      # exists (STS answers AccessDenied for a missing role too).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::798070830797:role/coderizehq-infra-plan
          aws-region: us-east-1
          aws-profile: preview

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-infra-plan
          aws-region: us-east-1
          aws-profile: live

      - name: Setup Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: .ci-tofu-actions

      - name: Negative trust tests
        env:
          SITES_DIR: sites
        run: node .ci-tofu-actions/scripts/trustProbe.mjs

  plan:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(inputs.roots) }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PROFILE: account
      ROOT: ${{ matrix.root.root }}
      OFFLINE: ${{ matrix.root.offline == true }}
      PARALLELISM: ${{ matrix.root.parallelism || 10 }}
      HAS_READ_APP: ${{ secrets.PLATFORM_READ_APP_KEY != '' && vars.PLATFORM_READ_APP_CLIENT_ID != '' }}
    steps:
      # Written first, so the comment says so if the job dies before planning.
      - name: Start the result
        id: slug
        run: |
          echo "RESULT_DIR=$RUNNER_TEMP/plan" >> "$GITHUB_ENV"
          RESULT_DIR=$RUNNER_TEMP/plan
          mkdir -p "$RESULT_DIR"
          jq -n --arg root "$ROOT" '{root: $root, status: "failed"}' > "$RESULT_DIR/result.json"
          echo "slug=${ROOT//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two named profiles, as in platform's apply.yml: `state` for the backend (the state bucket lets only the live
      # account's plan role read), `account` for the root's own resources.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-infra-plan
          aws-region: us-east-1
          aws-profile: state

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.root.account }}:role/coderizehq-infra-plan
          aws-region: us-east-1
          aws-profile: account

      - name: Install OpenTofu (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  tofu.zip" | sha256sum -c -
          unzip -q -o tofu.zip tofu -d "$RUNNER_TEMP/bin"

      # GitHub settings are read as the coderizehq-platform-read App (read-only permissions), never the platform App,
      # whose key lives only in the apply environment.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: read-app
        if: env.HAS_READ_APP == 'true'
        with:
          client-id: ${{ vars.PLATFORM_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_READ_APP_KEY }}
          owner: CoderizeHQ

      # The plan role denies every state write, the lock file included, hence -lock=false. A root whose provider
      # needs a token it wasn't given is skipped rather than failed, and the comment says why. The root's
      # "parallelism" (default 10) applies to the plan's refresh; anything but a whole number from 1 to 50 fails.
      - name: tofu plan
        working-directory: ${{ matrix.root.root }}
        env:
          # An offline root (the AI gateway's tunnel and Access app, in another Cloudflare account) gets no token at
          # all: the PR's code runs here, and no credential for those settings should be within its reach.
          CLOUDFLARE_API_TOKEN: ${{ matrix.root.offline != true && secrets.CLOUDFLARE_READ_TOKEN || '' }}
          GITHUB_TOKEN: ${{ steps.read-app.outputs.token }}
        run: |
          skip() {
            jq -n --arg root "$ROOT" --arg reason "$1" '{root: $root, status: "skipped", reason: $reason}' > "$RESULT_DIR/result.json"
            echo "::notice::$ROOT: plan skipped: $1"
            exit 0
          }
          if ! [[ "$PARALLELISM" =~ ^[1-9][0-9]?$ ]] || (( PARALLELISM > 50 )); then
            echo "::error::$ROOT: parallelism must be a whole number from 1 to 50, got '$PARALLELISM'"
            exit 1
          fi
          # A read-only App can't read org rulesets (403) or repositories' merge settings (they need contents write),
          # so a root with the github provider plans against its last applied state instead of live GitHub: exactly
          # what the PR changes. Hand-made changes to GitHub settings show in the plan apply.yml runs on every merge.
          refresh=()
          note=""
          # An offline root has no data sources and is planned against its last applied state without reading live
          # settings, so it needs no credentials; drift shows in apply.yml's plan on every merge, as for GitHub below.
          if [ "$OFFLINE" = true ]; then
            # A data source would need live credentials; say so plainly instead of failing on a provider auth error.
            if grep -qE '^data "' ./*.tf; then
              echo "::error::$ROOT is planned offline (no credentials), so it can't have data sources"
              exit 1
            fi
            refresh=(-refresh=false)
            note="against the last applied state, with no provider credentials; live settings aren't read"
          elif grep -qE '^provider "cloudflare"' ./*.tf && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            skip "needs the CLOUDFLARE_READ_TOKEN secret"
          fi
          if grep -qE '^provider "github"' ./*.tf; then
            [ -n "$GITHUB_TOKEN" ] || skip "needs the PLATFORM_READ_APP_KEY secret and the PLATFORM_READ_APP_CLIENT_ID variable"
            refresh=(-refresh=false)
            note="${note:-against the last applied state}; live GitHub settings aren't read"
          fi
          set +e
          {
            "$RUNNER_TEMP/bin/tofu" init -input=false -no-color &&
            "$RUNNER_TEMP/bin/tofu" plan -input=false -no-color -lock=false -parallelism="$PARALLELISM" "${refresh[@]}"
          } > "$RESULT_DIR/plan.txt" 2>&1
          code=$?
          set -e
          cat "$RESULT_DIR/plan.txt"
          status=$([ "$code" = 0 ] && echo planned || echo failed)
          jq -n --arg root "$ROOT" --arg status "$status" --arg note "$note" \
            '{root: $root, status: $status} + (if $note == "" then {} else {note: $note} end)' > "$RESULT_DIR/result.json"
          exit "$code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: plan-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/plan
          retention-days: 7

  comment:
    needs: plan
    # After the plans, failed or not, so a failed plan's error shows on the PR too.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # script from that same commit.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-tofu.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-tofu.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: ${{ runner.temp }}/plans

      - name: Post the plans
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PLANS_DIR: ${{ runner.temp }}/plans
        run: node actions/scripts/planComment.mjs
