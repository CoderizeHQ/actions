name: release

# Each site's release.yml calls this for a version tag (a merged release PR) and for the weekly dependency run on main:
#   uses: CoderizeHQ/actions/.github/workflows/release.yml@v1
#   with: { site: sbmcdn-com }
# A site in an app repo (platform README "Sites in an app repo") also names its deployment environment,
# live-<site>, so the sites sharing that repo keep separate deployment records:
#   with: { site: admin-example-com, deployment: live-admin-example-com }
# Only the site name comes in. The live bucket is coderizehq-live-<site> by contract; the distribution is the one whose
# Comment is exactly the site name (platform sets it, and the role may ListDistributions), and the domain is that
# distribution's apex alias. So nothing about the site is kept in its own repo. A distribution with no aliases yet (a
# site moving in by an alias move, platform's alias_move) is published to and checked on its own *.cloudfront.net name.
#
# `verify` decides through GitHub's API, with no AWS access: a version tag must be the release App's merged
# release-please-- PR, release files only, approved by James at its final commit; a run on main must be a gap of
# Renovate's passing lockfile-only minor and patch PRs since the last version release, or a go-live release (the
# repository_dispatch `go-live-release` from the platform App, naming this site), which `publish` then refuses unless
# the site's distribution serves no name yet (before its alias move); anything else is refused.
# `publish` then runs in the release environment as coderizehq-live-publish-<site> (its ARN comes from `site`), which
# trusts only this file at v1 or v1.*: it publishes the build deploy-preview stored for that exact commit, checks it
# on live, and records a GitHub deployment. IAM only lets it copy builds CI stored from main; that the build is the
# release James approved is what `verify` checks.
on:
  workflow_call:
    inputs:
      site:
        description: The site's name (its domain with dots as hyphens, as in platform/sites/<site>.json)
        type: string
        required: true
      max-delete-share:
        description: Refuse a publish that deletes more than this share of live's files (0 to 1)
        type: string
        default: '0.25'
      deployment:
        description: The GitHub deployment environment the release is recorded under, live or live-<site>
        type: string
        default: live

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
      kind: ${{ steps.verify.outputs.kind }}
      release-pr: ${{ steps.verify.outputs.release-pr }}
      approver: ${{ steps.verify.outputs.approver }}
      dependency-prs: ${{ steps.verify.outputs.dependency-prs }}
      reasons: ${{ steps.verify.outputs.reasons }}
      workflow-sha: ${{ steps.self.outputs.sha }}
    steps:
      # The name goes into role ARNs and S3 paths; coderizehq-preview-deploy-<site> must fit IAM's 64-character limit.
      - name: Check the site name
        env:
          SITE: ${{ inputs.site }}
        run: |
          [[ "$SITE" =~ ^[a-z0-9-]{1,38}$ ]] || { echo "::error::site must be 1 to 38 of a-z, 0-9 and -"; exit 1; }

      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts from that same commit.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/release.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of release.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      # The verify step needs no packages: it uses Node's own fetch.
      - name: Setup Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      # The event's fields decide a go-live release (platform's apply, as the platform App, for a site whose new
      # distribution has no aliases yet); they come in as environment only.
      - name: Verify the release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          SITE: ${{ inputs.site }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          PAYLOAD_SITE: ${{ github.event.client_payload.site }}
        run: node actions/scripts/release.mjs verify

  publish:
    needs: verify
    # Nothing merged since the last release: verify passed with nothing to publish.
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    # The live role trusts only jobs in this environment.
    environment: release
    # One queue per site for releases and rollbacks: a newer run waits, a running one is never cancelled.
    concurrency:
      group: release-${{ inputs.site }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      id-token: write
    outputs:
      site-url: ${{ steps.publish.outputs.site-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ needs.verify.outputs.workflow-sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - run: pnpm install --frozen-lockfile
        working-directory: actions

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-live-publish-${{ inputs.site }}
          aws-region: us-east-1

      - name: Publish to live
        id: publish
        env:
          SITE: ${{ inputs.site }}
          DEPLOYMENT: ${{ inputs.deployment }}
          MAX_DELETE_SHARE: ${{ inputs.max-delete-share }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.workflow-sha }}
          KIND: ${{ needs.verify.outputs.kind }}
          RELEASE_PR: ${{ needs.verify.outputs.release-pr }}
          APPROVER: ${{ needs.verify.outputs.approver }}
          DEPENDENCY_PRS: ${{ needs.verify.outputs.dependency-prs }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node actions/scripts/release.mjs publish

  # Emails ops@coderize.dev when a release publishes, and when it fails or is refused (email only, C955 a). Nothing is
  # sent when there was nothing to publish, or for a hand-started run on a ref the release can never take (neither a
  # version tag nor main), which coderizehq-notify-send doesn't trust. That role (live account) may only send from
  # notify@notify.coderize.dev to ops@ with the coderizehq-notify configuration set, and trusts only this file and
  # deploy-preview.yml at v1 or v1.*; its ARN is fixed here, never an input.
  notify:
    needs: [verify, publish]
    if: >-
      always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.publish.result == 'success' || contains(needs.*.result, 'failure'))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # verify's own answer isn't there if verify failed before finding it, so ask again.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/release.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of release.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - run: pnpm install --frozen-lockfile
        working-directory: actions

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-notify-send
          aws-region: us-east-1

      - name: Email ops@
        env:
          WORKFLOW: release
          SITE: ${{ inputs.site }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          RESULTS: verify=${{ needs.verify.result }},publish=${{ needs.publish.result }}
          KIND: ${{ needs.verify.outputs.kind }}
          RELEASE_PR: ${{ needs.verify.outputs.release-pr }}
          APPROVER: ${{ needs.verify.outputs.approver }}
          DEPENDENCY_PRS: ${{ needs.verify.outputs.dependency-prs }}
          REASONS: ${{ needs.verify.outputs.reasons }}
          SITE_URL: ${{ needs.publish.outputs.site-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node actions/scripts/notify.mjs
