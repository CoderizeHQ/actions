name: release

# Each site's release.yml calls this for a version tag (a merged release PR) and for the weekly dependency run on main:
#   uses: CoderizeHQ/actions/.github/workflows/release.yml@v1
#   with: { site: sbmcdn-com }
# A site in an app repo (platform README "Sites in an app repo") also names its deployment environment,
# live-<site>, so the sites sharing that repo keep separate deployment records:
#   with: { site: admin-example-com, deployment: live-admin-example-com }
# Only the site name comes in. The live bucket is coderizehq-live-<site> by contract; the distribution is the one whose
# Comment is exactly the site name (platform sets it, and the role may ListDistributions), and the domain is that
# distribution's apex alias. So nothing about the site is kept in its own repo. A distribution with no aliases yet (a
# site moving in by an alias move, platform's alias_move) is published to and checked on its own *.cloudfront.net name.
#
# `verify` decides through GitHub's API, with no AWS access: a version tag must be the release App's merged
# release-please-- PR, release files only, approved by James at its final commit; a run on main must be a gap of
# Renovate's passing lockfile-only minor and patch PRs since the last version release, or a go-live release (the
# repository_dispatch `go-live-release` from the platform App, naming this site), which `publish` then refuses unless
# the site's distribution serves no name yet (before its alias move), or a content rebuild (the repository_dispatch
# `content-rebuild` from the release App, as platform's content check, naming this site; scripts/lib/rebuild.mjs): the
# commit live runs now, which verify finds and re-checks itself, published from the rebuild the same run's
# deploy-preview job stored, and only to a distribution already serving the site; or a data refresh (the
# repository_dispatch `data-refresh` from the release App, as platform's refresh check, naming this site): the same
# target, a go-live release's commit included when it is an approved release, published from the refresh the same
# run's refresh-build and deploy-preview jobs built and stored (`refresh: true`), also to a distribution with no names
# yet (an alias move under way); anything else is refused.
#
# A site with data refreshes (platform's `refresh` record field) releases with its feed data (README "Data
# refreshes"): its platform-written release workflow calls this with `check-only: true` (verify alone; its
# `refreshable` output says whether the run's commit may be built with the feed's secrets), then refresh-build.yml and
# deploy-preview.yml, then this again with `refresh: true` and `refresh-results`, which publishes the run's stored
# refresh of its own commit instead of the commit's first build, so a release never puts a build without the feed data
# over a refreshed site.
# `publish` then runs in the release environment as coderizehq-live-publish-<site> (its ARN comes from `site`), which
# trusts only this file at v1 or v1.*: it publishes the build deploy-preview stored for that exact commit, checks it
# on live, and records a GitHub deployment. IAM only lets it copy builds CI stored from main; that the build is the
# release James approved is what `verify` checks.
#
# A government site (platform's `"government": true` record, in the Government account): platform writes
#   with: { site: emcog-org, account: government }
# into every call of it. `publish` then assumes arn:aws:iam::355600359887:role/coderizehq-live-publish-<site>, reads the
# build from that account's locked coderizehq-gov-builds-355600359887 and copies it into its locked
# coderizehq-live-<site>, and never deletes: what the build no longer has stays on live, and a page it no longer has
# refuses the release (nothing published) unless the site's redirect map sends that page's URL elsewhere (the record's
# `redirects`, which platform's redirect sync writes into coderizehq-government-redirects, read from there). `account`
# is live or government, checked before any AWS call; every other site passes nothing and gets live, unchanged.
on:
  workflow_call:
    inputs:
      site:
        description: The site's name (its domain with dots as hyphens, as in platform/sites/<site>.json)
        type: string
        required: true
      max-delete-share:
        description: Refuse a publish that deletes more than this share of live's files (0 to 1)
        type: string
        default: '0.25'
      deployment:
        description: The GitHub deployment environment the release is recorded under, live or live-<site>
        type: string
        default: live
      check-only:
        description: Only verify (a refresh site's release, before its refresh build); publish nothing, email only a refusal
        type: boolean
        default: false
      refresh:
        description: Publish this run's stored data refresh (refreshes/<run>/) of verify's commit instead of the commit's first build
        type: boolean
        default: false
      refresh-results:
        description: With refresh, how the run's refresh build and store jobs ended (build=<result>,store=<result>)
        type: string
        default: ''
      account:
        description: The account the site is live in, live or government (platform writes government for a government record); government publishes there and never deletes
        type: string
        default: live
    outputs:
      publish:
        description: Whether verify accepted a publish ('true' or 'false')
        value: ${{ jobs.verify.outputs.publish }}
      commit:
        description: The commit verify accepted
        value: ${{ jobs.verify.outputs.commit }}
      refreshable:
        description: Whether that commit may be built with the site's feed secrets (an approved released commit)
        value: ${{ jobs.verify.outputs.refreshable }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
      # A content rebuild reads which commit is live from the deployment records (within the caller's deployments: write).
      deployments: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
      refreshable: ${{ steps.verify.outputs.refreshable }}
      refresh: ${{ steps.verify.outputs.refresh }}
      refresh-reason: ${{ steps.verify.outputs.refresh-reason }}
      kind: ${{ steps.verify.outputs.kind }}
      commit: ${{ steps.verify.outputs.commit }}
      rebuild-basis: ${{ steps.verify.outputs.rebuild-basis }}
      rebuild-tag: ${{ steps.verify.outputs.rebuild-tag }}
      content-sha256: ${{ steps.verify.outputs.content-sha256 }}
      release-pr: ${{ steps.verify.outputs.release-pr }}
      approver: ${{ steps.verify.outputs.approver }}
      dependency-prs: ${{ steps.verify.outputs.dependency-prs }}
      reasons: ${{ steps.verify.outputs.reasons }}
      hold: ${{ steps.verify.outputs.hold }}
      workflow-sha: ${{ steps.self.outputs.sha }}
    steps:
      # The name goes into role ARNs and S3 paths; coderizehq-preview-deploy-<site> must fit IAM's 64-character limit.
      - name: Check the site name
        env:
          SITE: ${{ inputs.site }}
        run: |
          [[ "$SITE" =~ ^[a-z0-9-]{1,38}$ ]] || { echo "::error::site must be 1 to 38 of a-z, 0-9 and -"; exit 1; }

      # It picks the publish role's account; the publish job checks it again before its credentials.
      - name: Check the account
        env:
          ACCOUNT: ${{ inputs.account }}
        run: |
          [[ "$ACCOUNT" = live || "$ACCOUNT" = government ]] || { echo "::error::account must be live or government"; exit 1; }

      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts from that same commit.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/release.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of release.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      # The verify step needs no packages: it uses Node's own fetch.
      - name: Setup Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      # The event's fields decide a go-live release (platform's apply, as the platform App, for a site whose new
      # distribution has no aliases yet) and a content rebuild (platform's content check, as the release App); they come
      # in as environment only.
      - name: Verify the release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          SITE: ${{ inputs.site }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          PAYLOAD_SITE: ${{ github.event.client_payload.site }}
          PAYLOAD_CONTENT: ${{ github.event.client_payload.content_sha256 }}
          PAYLOAD_REASON: ${{ github.event.client_payload.reason }}
          DEPLOYMENT: ${{ inputs.deployment }}
          CHECK_ONLY: ${{ inputs.check-only }}
          REFRESH: ${{ inputs.refresh }}
          REFRESH_RESULTS: ${{ inputs.refresh-results }}
        run: node actions/scripts/release.mjs verify

  publish:
    needs: verify
    # Nothing merged since the last release: verify passed with nothing to publish. A check-only call publishes nothing.
    if: needs.verify.outputs.publish == 'true' && !inputs.check-only
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    # The live role trusts only jobs in this environment.
    environment: release
    # One queue per site for releases and rollbacks: a newer run waits, a running one is never cancelled.
    concurrency:
      group: release-${{ inputs.site }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      id-token: write
    outputs:
      site-url: ${{ steps.publish.outputs.site-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ needs.verify.outputs.workflow-sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      - run: pnpm install --frozen-lockfile
        working-directory: actions

      # The account map (scripts/lib/build.mjs ACCOUNTS): live is 243891826043, government 355600359887. Anything else
      # fails here, before any AWS call.
      - name: Pick the account
        id: account
        env:
          ACCOUNT: ${{ inputs.account }}
        run: |
          case "$ACCOUNT" in
            live) id=243891826043 ;;
            government) id=355600359887 ;;
            *) echo "::error::account must be live or government"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/coderizehq-live-publish-${{ inputs.site }}
          aws-region: us-east-1

      - name: Publish to live
        id: publish
        env:
          SITE: ${{ inputs.site }}
          DEPLOYMENT: ${{ inputs.deployment }}
          MAX_DELETE_SHARE: ${{ inputs.max-delete-share }}
          ACCOUNT: ${{ inputs.account }}
          REPO: ${{ github.repository }}
          # verify's commit: the run's own, except a content rebuild's (the live commit, stored as this run's rebuild).
          COMMIT: ${{ needs.verify.outputs.commit }}
          RUN_SHA: ${{ github.sha }}
          REBUILD_RUN: ${{ needs.verify.outputs.kind == 'content' && github.run_id || '' }}
          REBUILD_BASIS: ${{ needs.verify.outputs.rebuild-basis }}
          REBUILD_TAG: ${{ needs.verify.outputs.rebuild-tag }}
          CONTENT_SHA256: ${{ needs.verify.outputs.content-sha256 }}
          # A data refresh, or a refresh site's release with its feed data: this run's stored refresh.
          REFRESH_RUN: ${{ needs.verify.outputs.refresh == 'true' && github.run_id || '' }}
          REFRESH_REASON: ${{ needs.verify.outputs.refresh-reason }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.workflow-sha }}
          KIND: ${{ needs.verify.outputs.kind }}
          RELEASE_PR: ${{ needs.verify.outputs.release-pr }}
          APPROVER: ${{ needs.verify.outputs.approver }}
          DEPENDENCY_PRS: ${{ needs.verify.outputs.dependency-prs }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node actions/scripts/release.mjs publish

  # Emails ops@coderize.dev when a release publishes, and when it fails or is refused (email only, C955 a). Nothing is
  # sent when there was nothing to publish, or for a hand-started run on a ref the release can never take (neither a
  # version tag nor main), which coderizehq-notify-send doesn't trust. Nor for a weekly dependency run held for James
  # (verify's `hold`: the run still fails, and platform's weekly digest lists it), nor for a cron run repeating this
  # week's run (the decide step). That role (live account) may only send from
  # notify@notify.coderize.dev to ops@ with the coderizehq-notify configuration set, and trusts only this file and
  # deploy-preview.yml at v1 or v1.*; its ARN is fixed here, never an input.
  notify:
    needs: [verify, publish]
    if: >-
      always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.publish.result == 'success' || contains(needs.*.result, 'failure'))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # verify's own answer isn't there if verify failed before finding it, so ask again.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/release.yml
        run: |
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of release.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: actions

      # No AWS, no packages. A weekly run held for James emails nothing (platform's weekly digest lists every held
      # site), nor does GitHub's backup cron when it repeats, for the same commit and with the same result, a run
      # this week's slot already had (scripts/notify.mjs shouldEmail). Anything else emails as before; so does a
      # lookup that fails.
      - name: Decide whether to email
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          SCHEDULE: ${{ github.event.schedule }}
          HOLD: ${{ needs.verify.outputs.hold }}
          RESULTS: verify=${{ needs.verify.result }},publish=${{ needs.publish.result }}
        run: node actions/scripts/notify.mjs decide

      - run: pnpm install --frozen-lockfile
        if: steps.decide.outputs.send == 'true'
        working-directory: actions

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.decide.outputs.send == 'true'
        with:
          role-to-assume: arn:aws:iam::243891826043:role/coderizehq-notify-send
          aws-region: us-east-1

      - name: Email ops@
        if: steps.decide.outputs.send == 'true'
        env:
          WORKFLOW: release
          SITE: ${{ inputs.site }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ needs.verify.outputs.commit || github.sha }}
          RESULTS: verify=${{ needs.verify.result }},publish=${{ needs.publish.result }}
          KIND: ${{ needs.verify.outputs.kind }}
          RELEASE_PR: ${{ needs.verify.outputs.release-pr }}
          APPROVER: ${{ needs.verify.outputs.approver }}
          DEPENDENCY_PRS: ${{ needs.verify.outputs.dependency-prs }}
          REASONS: ${{ needs.verify.outputs.reasons }}
          SITE_URL: ${{ needs.publish.outputs.site-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node actions/scripts/notify.mjs
