name: ci-node

# The checks on every PR of a Node repo that isn't a site: the AI services, claude-config, and actions itself (plan,
# Phase 3 "Shared workflows", ci-node). A repo's ci.yml calls it:
#   uses: CoderizeHQ/actions/.github/workflows/ci-node.yml@v1
#   permissions: { contents: read, actions: read }
# actions' own ci.yml calls it by path, so a change to these checks is tested on its own PR.
#
# The PR title, gitleaks over the full history and the dependency audit, then install, ESLint (where the repo has a
# config) and tests (where package.json has a test script). The scripts come from this workflow's own commit.
on:
  workflow_call:
    inputs:
      # An API whose tests need Postgres (STANDARDS.md 6): a temporary branch of the CI Neon project (no client data,
      # its main an empty database), made by `testdb-create` before the tests and deleted by `testdb-delete` after
      # (scripts/neonTestBranch.mjs). Those two jobs hold the API key and run no code from the repo under test. The
      # tests get DATABASE_URL (pooled) and DIRECT_URL for a role and database made on that branch alone, so nothing
      # they hold opens the project's main or another run's branch. The repo's test setup migrates the empty database.
      # The caller passes the key:
      #   with: { test-database: true }
      #   secrets: { NEON_CI_API_KEY: ${{ secrets.NEON_CI_API_KEY }} }
      test-database:
        type: boolean
        default: false
    secrets:
      NEON_CI_API_KEY:
        required: false

permissions:
  contents: read

env:
  # From gitleaks_8.30.1_checksums.txt on the gitleaks release page, as in ci-tofu.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Makes the test branch. Holds the API key; checks out only actions at this workflow's commit, never the repo under
  # test, so nothing from a PR runs here.
  testdb-create:
    if: inputs.test-database
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      branch: ${{ steps.create.outputs.branch }}
      host: ${{ steps.create.outputs.host }}
      password: ${{ steps.create.outputs.password }}
    steps:
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-node.yml
        run: |
          # In actions itself the workflow commit is the PR's own code, which must never run beside the key.
          if [ "$GITHUB_REPOSITORY" = CoderizeHQ/actions ]; then echo "::error::test-database is not available in actions' own CI"; exit 1; fi
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-node.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Make the test branch
        id: create
        env:
          NEON_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          NODE_OPTIONS: ''
        run: node actions/scripts/neonTestBranch.mjs create

  ci-node:
    needs: testdb-create
    # Always runs, so the required check can never pass by being skipped. Its Tests step fails if a test database was
    # asked for and testdb-create didn't make one.
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: repo

      # A reusable workflow can't see its own ref, so ask GitHub which commit of this file the run uses, and load the
      # scripts from that same commit. In actions itself that's the commit under test, already checked out.
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-node.yml
        run: |
          if [ "$GITHUB_REPOSITORY" = CoderizeHQ/actions ]; then
            echo "scripts=repo" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-node.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"
          echo "scripts=actions" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.self.outputs.scripts == 'actions'
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false
          working-directory: repo

      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node "${{ steps.self.outputs.scripts }}/scripts/prTitle.mjs"

      # The binary, not gitleaks-action, which needs a paid licence for organizations.
      - name: gitleaks (full history)
        working-directory: ${{ runner.temp }}
        env:
          CONFIG: ${{ github.workspace }}/${{ steps.self.outputs.scripts }}/config/gitleaks.toml
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 --config "$CONFIG" "$GITHUB_WORKSPACE/repo"

      # Moderate and above fail, unless audit-ignore.json lists the advisory with a reason and an unexpired date.
      - name: Dependency audit
        env:
          REPO_DIR: repo
        run: node "${{ steps.self.outputs.scripts }}/scripts/auditCheck.mjs"

      - name: Install
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: repo
        run: |
          config=$(find . -maxdepth 1 -name 'eslint.config.*' -print -quit)
          if [ -z "$config" ]; then
            echo "::notice::No eslint.config.js in this repo, so it isn't linted (the shared config comes in Phase 4)"
            exit 0
          fi
          [ -x node_modules/.bin/eslint ] || { echo "::error::the repo has an ESLint config but doesn't install eslint; add it to devDependencies"; exit 1; }
          pnpm exec eslint .

      # With a test database: URLs for the branch's own role and database (outputs of testdb-create). The API key never
      # reaches this job. A test database asked for and not made fails here, so the check can't pass without it.
      - name: Tests
        working-directory: repo
        env:
          TEST_DATABASE: ${{ inputs.test-database }}
          TESTDB_RESULT: ${{ needs.testdb-create.result }}
          TEST_DB_HOST: ${{ needs.testdb-create.outputs.host }}
          TEST_DB_PASSWORD: ${{ needs.testdb-create.outputs.password }}
        run: |
          if [ "$TEST_DATABASE" = true ]; then
            if [ "$TESTDB_RESULT" != success ] || [ -z "$TEST_DB_HOST" ] || [ -z "$TEST_DB_PASSWORD" ]; then
              echo "::error::test-database is on, but testdb-create didn't make a test database (result: $TESTDB_RESULT)"
              exit 1
            fi
            echo "::add-mask::$TEST_DB_PASSWORD"
          fi
          if ! jq -e '.scripts.test' package.json >/dev/null; then
            echo "::notice::package.json has no test script, so there are no tests to run"
            exit 0
          fi
          if [ "$TEST_DATABASE" = true ]; then
            export DATABASE_URL="postgresql://ci_tests:${TEST_DB_PASSWORD}@${TEST_DB_HOST}/tests?sslmode=require"
            export DIRECT_URL="postgresql://ci_tests:${TEST_DB_PASSWORD}@${TEST_DB_HOST/-pooler./.}/tests?sslmode=require"
          fi
          unset TEST_DB_PASSWORD
          pnpm test

  # Deletes the test branch whatever happened. Holds the API key; like testdb-create, runs no code from the repo.
  testdb-delete:
    needs: [testdb-create, ci-node]
    if: ${{ always() && needs.testdb-create.outputs.branch != '' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Find this workflow's commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: CoderizeHQ/actions/.github/workflows/ci-node.yml
        run: |
          # In actions itself the workflow commit is the PR's own code, which must never run beside the key.
          if [ "$GITHUB_REPOSITORY" = CoderizeHQ/actions ]; then echo "::error::test-database is not available in actions' own CI"; exit 1; fi
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith(env.WORKFLOW + "@")) | .sha] | unique | .[]')
          [ "$(wc -w <<<"$shas")" = 1 ] || { echo "::error::can't tell which commit of ci-node.yml this run uses"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoderizeHQ/actions
          ref: ${{ steps.self.outputs.sha }}
          path: actions
          persist-credentials: false

      - name: Delete the test branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          NODE_OPTIONS: ''
          BRANCH: ${{ needs.testdb-create.outputs.branch }}
        run: node actions/scripts/neonTestBranch.mjs delete "$BRANCH"
